<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>Planning Fundamentals | Learning Lab</title>
<style>
:root{color-scheme:dark;--bg:#091322;--panel:#111f32;--panel2:#172940;--line:#2a3b52;--text:#edf4fb;--muted:#aabbd0;--accent:#79d6c5;--gold:#f1c985}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{border-right:1px solid var(--line);padding:28px 18px;position:sticky;top:0;height:100vh;overflow:auto;background:#0d192a}.brand{font-size:1.2rem;font-weight:800;letter-spacing:.02em}.brand small{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}.nav{display:grid;gap:6px;margin-top:30px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:12px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}main{width:min(1150px,100%);padding:36px clamp(20px,5vw,72px);margin:auto}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:.77rem;font-weight:800}h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.16;margin:.5rem 0}h2{line-height:1.25;font-size:1.55rem}h3{margin:.3rem 0}.lead{color:var(--muted);font-size:1.08rem;max-width:760px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0}.search{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:13px 16px;border-radius:12px;min-width:200px;flex:1}.btn{background:var(--accent);color:#082326;border:0;border-radius:10px;padding:11px 16px;font-weight:750}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;min-width:0}.card p,.muted{color:var(--muted)}.card button{margin-top:10px}.tag{font-size:.74rem;color:var(--accent);font-weight:750;text-transform:uppercase;letter-spacing:.08em}.detail{max-width:840px}.detail h2{margin-top:32px}.detail p{color:#d4e0ed}.callout{border-left:3px solid var(--accent);padding:16px 20px;background:var(--panel2);border-radius:0 12px 12px 0;margin:24px 0}.steps{display:grid;gap:10px;margin-top:24px}.step{display:flex;gap:18px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px;color:var(--text)}.num{display:grid;place-items:center;background:var(--panel2);border-radius:50%;width:42px;height:42px;flex:none;color:var(--accent);font-weight:800}.step small{display:block;color:var(--muted)}.crumb{background:none;border:0;color:var(--accent);padding:0;margin-bottom:18px}.quiz{max-width:780px}.choice{display:block;text-align:left;width:100%;margin:9px 0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:15px}.choice.selected{border-color:var(--accent);background:#1b3842}.feedback{margin:20px 0;padding:17px;border-radius:12px;background:var(--panel2)}.progress{height:8px;background:var(--line);border-radius:12px;overflow:hidden}.progress span{display:block;background:var(--accent);height:100%}.mobile-head{display:none}.empty{padding:32px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}footer{margin-top:50px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.83rem}a{color:var(--accent)}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(max-width:760px){.layout{display:block}.side{position:static;height:auto;padding:15px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:1rem}.nav{display:flex;overflow-x:auto;margin-top:12px;gap:4px}.nav button{white-space:nowrap;padding:9px 12px}main{padding:25px 18px}.cards{grid-template-columns:1fr}.step{padding:13px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">Planning Fundamentals<small>Reference & Learning Lab</small></div><nav class="nav" aria-label="Main navigation" id="nav"></nav></aside><main id="app" tabindex="-1"></main></div>
<script>
'use strict';
const topics=[
{id:'overview',category:'Foundations',title:'What is Federal Water Resources Planning?',summary:'Understand planning as a structured process for making defensible public investment decisions.',sections:[['The purpose','Federal water resources planning identifies problems and opportunities, develops reasonable alternatives, and supports transparent decisions about public investments. The process integrates engineering, economics, environmental considerations, and social effects.'],['A planning mindset','Begin with the problem rather than a preferred project. Distinguish observed conditions from assumptions, identify uncertainties, and connect each recommendation to evidence.'],['Key questions','Who experiences the problem? What is the without-project future? What federal interest exists? Which alternatives are reasonable? How do benefits, costs, risks, and tradeoffs compare?']],takeaway:'Good planning is decision-oriented, iterative, interdisciplinary, and traceable.'},
{id:'six',category:'Process',title:'The Six-Step Planning Process',summary:'A repeatable framework for moving from problems to a recommended plan.',sections:[['1. Specify problems and opportunities','Describe existing and expected conditions, affected people and resources, causes, consequences, and opportunities.'],['2. Inventory and forecast conditions','Establish the existing condition and future without-project condition for the period of analysis. Identify data limitations and uncertainty.'],['3. Formulate alternative plans','Develop measures and combine them into alternative plans that address objectives while respecting constraints.'],['4. Evaluate effects','Estimate the effects of each alternative relative to the future without-project condition across relevant accounts and metrics.'],['5. Compare alternative plans','Compare tradeoffs, benefits, costs, risk, uncertainty, and performance against objectives.'],['6. Select a recommended plan','Explain the rationale for the recommendation and document remaining uncertainties, implementation considerations, and decisions.']],takeaway:'The six steps are iterative: new information may require revisiting earlier steps.'},
{id:'problems',category:'Formulation',title:'Problems, Opportunities & Objectives',summary:'Turn a broad concern into a clear, testable planning framework.',sections:[['Problem statements','Describe the adverse condition, who or what is affected, its location, and the consequences. Avoid embedding a preferred solution.'],['Opportunities','Identify conditions that could be improved through a federal action within the study authority.'],['Objectives','Write outcome-focused objectives that are specific enough to evaluate, tied to a location and planning horizon where appropriate.'],['Constraints','Separate legal, policy, physical, and operational limitations from preferences or assumptions.']],takeaway:'“Reduce expected flood damages” is an objective; “build a levee” is a measure, not an objective.'},
{id:'baseline',category:'Formulation',title:'Existing & Future Without-Project Conditions',summary:'Build the comparison baseline for estimating project effects.',sections:[['Existing conditions','Document current physical, environmental, economic, and social conditions using defensible data.'],['Without-project forecast','Describe the most likely future in the absence of the proposed federal project, including reasonably foreseeable actions and changing conditions.'],['Uncertainty','Identify scenarios and assumptions that could materially alter outcomes.']],takeaway:'Project effects are measured against the future without-project condition, not simply against today.'},
{id:'alternatives',category:'Formulation',title:'Measures & Alternative Plans',summary:'Develop a meaningful range of solutions without prematurely narrowing choices.',sections:[['Measures','A measure is an individual action that addresses one or more planning objectives. Examples may include structural, nonstructural, nature-based, or operational measures.'],['Alternative plans','Combine compatible measures into distinct strategies. Include a no-action or without-project comparison as appropriate to the decision framework.'],['Screening','Use explicit criteria and document why measures or alternatives advance or are eliminated. Avoid treating early estimates as certain.']],takeaway:'A strong alternatives analysis preserves reasonable choices and makes screening decisions traceable.'},
{id:'accounts',category:'Evaluation',title:'Evaluation Accounts & Tradeoffs',summary:'Understand how economic, environmental, regional, and social effects inform decisions.',sections:[['National Economic Development (NED)','Analyze changes in the economic value of national output of goods and services under applicable guidance.'],['Environmental Quality (EQ)','Consider nonmonetary environmental effects and ecosystem outcomes.'],['Regional Economic Development (RED)','Describe distributional effects on regional economic activity where relevant.'],['Other Social Effects (OSE)','Examine life safety, community cohesion, equity, displacement, resilience, and other social considerations.'],['Contemporary guidance','Applicable planning requirements and the treatment of accounts vary by authority and current federal guidance; verify the controlling documents for each study.']],takeaway:'A decision should make tradeoffs visible rather than hide them in a single score.'},
{id:'risk',category:'Evaluation',title:'Risk, Uncertainty & Sensitivity',summary:'Learn to distinguish uncertain inputs, possible outcomes, and decision consequences.',sections:[['Risk','Risk concerns uncertain outcomes and their consequences. Describe both likelihood and severity when defensible.'],['Uncertainty','Separate natural variability, data limitations, modeling uncertainty, and future scenario uncertainty.'],['Sensitivity','Test whether reasonable changes in assumptions alter rankings, benefits, costs, or the recommended plan.'],['Communication','Explain uncertainties in plain language without implying unsupported precision.']],takeaway:'A robust recommendation remains defensible across plausible conditions.'},
{id:'documents',category:'Practice',title:'Study Documentation & Decision Record',summary:'Organize the evidence, rationale, and review trail behind a planning recommendation.',sections:[['Traceability','Connect the problem, objectives, baseline, alternatives, evaluation, comparison, and recommendation.'],['Coordination','Record sponsor engagement, interdisciplinary inputs, agency coordination, and public involvement as applicable.'],['Quality','Track assumptions, source dates, versioning, review comments, and unresolved issues.'],['Authorities','Confirm current USACE guidance, study authority, policy exceptions, and required review levels for the specific project.']],takeaway:'The documentation should allow a reviewer to reconstruct how the decision was made.'},
{id:'cap',category:'Practice',title:'CAP & Feasibility Study Orientation',summary:'Understand how study authority, scope, funding, and milestones shape formulation.',sections:[['Authority first','Identify the relevant statutory authority, program, purpose, eligibility, and federal interest before designing a solution.'],['Scope and scale','Match the level of analysis to the decision, risks, and applicable requirements.'],['Milestones','Define decision points, dependencies, sponsor responsibilities, and review needs early.'],['Important limitation','This overview is educational and is not a substitute for current CAP guidance, ERs, ECs, policy memoranda, or district counsel and policy review.']],takeaway:'Different authorities may impose different eligibility, cost-share, formulation, and approval requirements.'}
];
const questions=[
{q:'Which comparison is generally used to estimate a proposed plan’s effects?',a:['Existing conditions only','Future without-project conditions','The highest-cost alternative'],correct:1,why:'The future without-project condition is the baseline for evaluating plan effects.'},
{q:'Which is written as a planning objective?',a:['Construct a floodwall','Reduce expected flood-related damages','Select the preferred contractor'],correct:1,why:'Objectives express desired outcomes; a floodwall is a possible measure.'},
{q:'When should the six-step process be revisited?',a:['Never, steps are strictly linear','When new evidence changes earlier assumptions','Only after final approval'],correct:1,why:'Planning is iterative; evidence can change the problem definition or alternatives.'},
{q:'Which topic fits Other Social Effects?',a:['Community cohesion and life safety','Only construction unit costs','Only hydraulic roughness'],correct:0,why:'OSE can include community and human consequences that are not fully represented by monetary metrics.'},
{q:'What is a useful sensitivity test?',a:['Ignore uncertainty','Change a key assumption and see whether the decision changes','Always choose the cheapest plan'],correct:1,why:'Sensitivity testing helps assess whether recommendations depend heavily on uncertain inputs.'}
];
const nav=[['home','Overview'],['process','Six Steps'],['library','Knowledge Library'],['practice','Knowledge Checks'],['glossary','Glossary'],['sources','Sources & Guidance']];
let page='home',selected=null,filter='',quiz=0,choice=null,answers=JSON.parse(localStorage.getItem('pf-answers')||'{}');
const app=document.getElementById('app'),navEl=document.getElementById('nav');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function navigate(p,id){page=p;selected=id||null;filter='';choice=null;render();window.scrollTo(0,0);app.focus({preventScroll:true});}
function drawNav(){navEl.innerHTML=nav.map(([id,label])=>'<button type="button" data-nav="'+id+'" class="'+(page===id?'active':'')+'" '+(page===id?'aria-current="page"':'')+'>'+label+'</button>').join('');navEl.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));}
function header(k,t,s){return '<div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="lead">'+s+'</p>';}
function card(t){return '<article class="card"><span class="tag">'+escapeHtml(t.category)+'</span><h3>'+escapeHtml(t.title)+'</h3><p>'+escapeHtml(t.summary)+'</p><button class="btn secondary" data-topic="'+t.id+'">Explore topic</button></article>';}
function bindTopics(){app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>navigate('library',b.dataset.topic));}
function render(){
drawNav();
if(page==='home'){app.innerHTML=header('Your planning companion','Learn the process. Understand the decisions.','A clear, practical reference for federal water resources planning, from defining the problem to documenting a recommended plan.')+'<div class="toolbar"><button class="btn" id="start">Explore the six steps</button><button class="btn secondary" id="browse">Browse reference library</button></div><h2>Start with the fundamentals</h2><div class="cards">'+[topics[0],topics[2],topics[5]].map(card).join('')+'</div><div class="callout"><strong>Designed for learning and field reference.</strong> Concepts are educational summaries, not controlling USACE policy. Always verify current guidance and project authority.</div>';document.getElementById('start').onclick=()=>navigate('process');document.getElementById('browse').onclick=()=>navigate('library');bindTopics();}
if(page==='process'){app.innerHTML=header('The planning framework','Six steps, one defensible decision.','Explore each step and see how it connects to the overall formulation process.')+'<div class="steps">'+topics.find(t=>t.id==='six').sections.map((s,i)=>'<button class="step" data-step="'+i+'"><span class="num">'+(i+1)+'</span><span><strong>'+escapeHtml(s[0].replace(/^\d\. /,''))+'</strong><small>'+escapeHtml(s[1])+'</small></span></button>').join('')+'</div><div class="callout">The process is iterative. Revisiting an earlier step can be necessary when evidence or constraints change.</div>';app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>navigate('library','six'));}
if(page==='library'){if(selected){const t=topics.find(x=>x.id===selected);app.innerHTML='<button class="crumb" id="back">← All topics</button><div class="detail">'+header(t.category,escapeHtml(t.title),escapeHtml(t.summary))+t.sections.map(s=>'<section><h2>'+escapeHtml(s[0])+'</h2><p>'+escapeHtml(s[1])+'</p></section>').join('')+'<div class="callout"><strong>Remember:</strong> '+escapeHtml(t.takeaway)+'</div><button class="btn secondary" id="next">Next topic</button></div>';document.getElementById('back').onclick=()=>navigate('library');document.getElementById('next').onclick=()=>navigate('library',topics[(topics.indexOf(t)+1)%topics.length].id);}else{app.innerHTML=header('Browse by concept','Knowledge Library','Concise explanations for quick reference, with enough context to support deeper learning.')+'<div class="toolbar"><input id="search" class="search" aria-label="Search topics" placeholder="Search concepts, steps, or keywords…" value="'+escapeHtml(filter)+'"></div><div id="results"></div>';const input=document.getElementById('search');input.oninput=()=>{filter=input.value;results();};results();}}
if(page==='practice')renderQuiz();
if(page==='glossary'){const terms=[['Alternative plan','A strategy composed of one or more measures to address planning objectives.'],['Constraint','A limitation that restricts the formulation or implementation of alternatives.'],['Federal interest','A basis under applicable law and policy for federal participation in addressing a water resources problem.'],['Measure','An individual action considered for achieving a planning objective.'],['NED','National Economic Development: an evaluation account focused on national economic value.'],['OSE','Other Social Effects: effects on people and communities not fully captured in other accounts.'],['Planning objective','A desired outcome tied to an identified problem or opportunity.'],['Sensitivity analysis','Testing how results change under different assumptions.'],['Without-project condition','Forecasted conditions in the absence of the proposed federal project.']];app.innerHTML=header('Quick reference','Glossary','Common terminology used throughout planning and formulation.')+'<div class="cards">'+terms.map(x=>'<article class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></article>').join('')+'</div>';}
if(page==='sources'){app.innerHTML=header('Verify the authority','Sources & Guidance','Use primary federal guidance for project-specific requirements. Reference documents can be integrated here when available.')+'<div class="cards"><article class="card"><h3>USACE Planning</h3><p>Planning resources, guidance, and policy context.</p><a href="https://www.usace.army.mil/Missions/Civil-Works/Planning/" target="_blank" rel="noopener">USACE Civil Works Planning ↗</a></article><article class="card"><h3>USACE Publications</h3><p>Locate current regulations, engineering manuals, circulars, and other official publications.</p><a href="https://www.publications.usace.army.mil/" target="_blank" rel="noopener">Official publications ↗</a></article><article class="card"><h3>USACE Headquarters</h3><p>Confirm program information, authorities, and current organizational guidance.</p><a href="https://www.usace.army.mil/" target="_blank" rel="noopener">USACE website ↗</a></article></div><div class="callout"><strong>Reference status:</strong> No repository-provided reference documents were accessible when this initial version was created. Content is an original introductory synthesis and must be validated against current authoritative guidance before operational use.</div>';}
app.insertAdjacentHTML('beforeend','<footer>Planning Fundamentals · Educational reference · Not an official USACE product or policy interpretation · v1.0</footer>');
}
function results(){const q=filter.toLowerCase().trim();const items=topics.filter(t=>(t.title+' '+t.summary+' '+t.category+' '+t.sections.flat().join(' ')).toLowerCase().includes(q));document.getElementById('results').innerHTML=items.length?'<div class="cards">'+items.map(card).join('')+'</div>':'<div class="empty">No matching topics. Try a broader term.</div>';bindTopics();}
function renderQuiz(){const q=questions[quiz];let count=Object.keys(answers).length;app.innerHTML=header('Practice and reflect','Knowledge Checks','Short questions reinforce important planning distinctions. Answers are saved only in this browser.')+'<div class="quiz"><p class="muted">Question '+(quiz+1)+' of '+questions.length+' · '+count+' answered</p><div class="progress"><span style="width:'+(count/questions.length*100)+'%"></span></div><h2>'+escapeHtml(q.q)+'</h2>'+q.a.map((a,i)=>'<button class="choice '+(choice===i?'selected':'')+'" data-choice="'+i+'">'+escapeHtml(a)+'</button>').join('')+'<button class="btn" id="check" '+(choice===null?'disabled':'')+'>Check answer</button><div id="feedback" aria-live="polite"></div><div class="toolbar"><button class="btn secondary" id="prev" '+(quiz===0?'disabled':'')+'>Previous</button><button class="btn secondary" id="next" '+(quiz===questions.length-1?'disabled':'')+'>Next</button><button class="btn secondary" id="reset">Reset progress</button></div></div>';app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('check').disabled=false;});document.getElementById('check').onclick=()=>{answers[quiz]=choice===q.correct;localStorage.setItem('pf-answers',JSON.stringify(answers));document.getElementById('feedback').innerHTML='<div class="feedback"><strong>'+(choice===q.correct?'Correct.':'Not quite.')+'</strong> '+escapeHtml(q.why)+'</div>';};document.getElementById('prev').onclick=()=>{quiz--;choice=null;render();};document.getElementById('next').onclick=()=>{quiz++;choice=null;render();};document.getElementById('reset').onclick=()=>{answers={};localStorage.removeItem('pf-answers');choice=null;render();};}
render();
</script><script src="learning-lab.js" defer></script><script src="planning-lab-v3.js" defer></script><script src="reference-explorer-v4.js" defer></script><script src="guided-study-v5.js" defer></script><script src="mastery-lab-v6.js" defer></script></body></html>
